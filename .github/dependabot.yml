version: 2

# One grouped pull request per ecosystem for every minor and patch bump.
# `dependabot/fetch-metadata` reports a group's highest semver change, so the
# minor/patch allowlist in dependabot-auto-merge.yml still decides; a major
# arrives on its own and waits for a human.
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      prefix-development: deps-dev
      include: scope
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Pinned to `.bun-version` by `check:bun-version`, so it moves in the
      # pull request that bumps Bun and never on its own.
      - dependency-name: "@types/bun"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
