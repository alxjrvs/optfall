# Daily: rebuild `data/spoilers/spoilers.json` and, if it changed, open a pull
# request that merges itself once `CI Success` passes.
#
# WHAT IT RUNS. `bun run spoilers` — see `scripts/build-spoilers.ts` for the
# source and what counts as a spoiler. That script writes no timestamp of its
# own, so an unchanged upstream is an empty diff and this job ends without
# opening anything.
#
# A PULL REQUEST WITH AUTO-MERGE, NOT A DIRECT COMMIT. The `main` ruleset set by
# `.github/gate.sh` in alxjrvs/dotFiles has no bypass for anyone, so a push to
# `main` is refused whoever makes it. The pull request goes through the same
# `CI Success` gate as any other and lands minutes after the run, with no
# review; its merge is a push to `main`, which deploys the site.
#
# ONE BRANCH, `spoilers/update`, force-pushed from `main` each run, so there is
# never more than one spoilers pull request open: a newer run replaces the
# older one's commit.
#
# IT NEEDS `SPOILERS_TOKEN`, a fine-grained token on this repository with
# Contents and Pull requests read and write. `GITHUB_TOKEN` will not do: the
# repository forbids Actions from creating pull requests, and a pull request
# opened with `GITHUB_TOKEN` would never trigger `ci.yml`, so `CI Success`
# would never report and the merge would wait forever. Without the secret the
# job fails at checkout.
#
# This file is public and contains no secrets, and must never contain one.
name: Spoilers

on:
  schedule:
    # Once a day. The hour is arbitrary.
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spoilers
  cancel-in-progress: false

jobs:
  update:
    name: update spoilers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.SPOILERS_TOKEN }}

      - name: Set up
        uses: ./.github/actions/setup
        with:
          install: "true"

      - name: Rebuild spoilers
        run: bun run spoilers

      - name: Anything new?
        id: diff
        run: |
          if git diff --quiet -- data/spoilers; then
            echo "No new spoilers."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SPOILERS_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          count=$(bun -e 'console.log((await Bun.file("data/spoilers/spoilers.json").json()).counts.cards)')
          git switch -c spoilers/update
          git add data/spoilers
          git commit -m "Update spoilers ($count cards)"
          git push --force origin spoilers/update
          if ! gh pr view spoilers/update --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr create --base main --head spoilers/update \
              --title "Update spoilers" \
              --body "Rebuilt by \`.github/workflows/spoilers.yml\`. Merges itself once \`CI Success\` passes."
          fi
          gh pr edit spoilers/update --title "Update spoilers ($count cards)"
          gh pr merge spoilers/update --auto --squash
