name: CI

# Runs on every pull request and on every push to main.
#
# Deliberately NO workflow-level `paths:` / `paths-ignore:` filter. The `gate`
# job below is the sole required status check on the default branch, and a
# workflow-level path filter would skip the entire workflow — including `gate` —
# leaving the required check stuck in "pending" forever. Filter individual jobs
# instead; `gate` treats a skipped job as a pass.
on:
  pull_request:
  push:
    branches: [main]

# Minimal by default. No job here needs anything beyond reading the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# There is deliberately NO `BUN_VERSION` here. Every `Set up Bun` step below
# reads `.bun-version` at the repository root instead, via setup-bun's
# `bun-version-file`.
#
# The version was pinned EXACTLY in this file first, because it had been the
# floating line "1.3.x": a floating line means a green gate can attest to a
# build on a Bun that never produced the deploy preview, and never will again.
# `bunfig.toml` already pins every dependency exactly for the same reason; the
# runtime that installs them should not be the one floating thing.
#
# An exact pin in this file was still only CI's pin. Bun here is the runtime,
# the test runner and the script runner, so a laptop on a different Bun runs
# different tests — not merely a different install resolution. `.bun-version` is
# the version a developer's toolchain reads too, which makes it the one place
# the number lives. `bun run check:bun-version` fails when any other surface
# that must carry the number literally — the two `netlify.toml` files,
# `engines.bun`, the `@types/bun` pin — disagrees with it.

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: |
          set -euo pipefail
          # No fallback branch. bun.lock is committed, so the only thing an
          # `else` could ever do is let a pull request that DELETES the lockfile
          # silently downgrade every job to an unpinned install and still go
          # green — which is the one case where failing loudly is the point.
          bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: |
          set -euo pipefail
          # No fallback branch. bun.lock is committed, so the only thing an
          # `else` could ever do is let a pull request that DELETES the lockfile
          # silently downgrade every job to an unpinned install and still go
          # green — which is the one case where failing loudly is the point.
          bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # THE FORMATTER IS A GATE, NOT A SUGGESTION. It is new — this repo had no
      # formatter at all — and a formatter nothing enforces is a formatter that
      # drifts back out within a month.
      - name: Format
        run: bun run format:check

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: |
          set -euo pipefail
          # No fallback branch. bun.lock is committed, so the only thing an
          # `else` could ever do is let a pull request that DELETES the lockfile
          # silently downgrade every job to an unpinned install and still go
          # green — which is the one case where failing loudly is the point.
          bun install --frozen-lockfile

      - name: Test
        run: bun run test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: |
          set -euo pipefail
          # No fallback branch. bun.lock is committed, so the only thing an
          # `else` could ever do is let a pull request that DELETES the lockfile
          # silently downgrade every job to an unpinned install and still go
          # green — which is the one case where failing loudly is the point.
          bun install --frozen-lockfile

      - name: Build
        run: bun run build

  no-llm-dependencies:
    name: no-llm-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Enforces the project-wide rule in docs/PLAN.md ("Rules that hold across
      # every phase"): no language model in the shipped product.
      #
      # This matches dependency NAMES declared in package.json manifests. It
      # deliberately does NOT grep source or documentation: docs/PLAN.md
      # discusses language models at length and by name, and a content grep
      # would fail the build on the very document that states the rule.
      #
      # The scanner is scripts/check-no-llm-deps.ts, not a heredoc in this file.
      # It lived here as ~240 lines of TypeScript written to $RUNNER_TEMP, which
      # made it the one gate job an agent could not reproduce locally, and the
      # only code in the repository that lint, format and typecheck never saw.
      - name: Assert no language-model or AI SDK dependency
        run: bun run check:no-llm

  # docs/PLAN.md Phase 1: "A lint rule fails the build on a raw hex or a raw
  # pixel value inside a component." This is that rule, and it is a required
  # job because the plan is explicit that the difference between a design
  # language and a folder of screenshots is enforcement rather than intent.
  #
  # It is a separate job from `lint` because it is a different KIND of check:
  # `check-tokens.ts` reads the CSS inside `.svelte` and `.astro` files and
  # asserts against the token vocabulary, which no general-purpose linter
  # models.
  #
  # It previously said this job existed "because oxlint cannot parse .svelte or
  # .astro". Half of that was wrong — measured against an identical duplicate
  # declaration in each, oxlint reported the `.svelte` one and stayed silent on
  # `.astro`. The `.astro` half was true and is why the linter changed; see
  # `biome.jsonc`. Neither half was ever the reason for THIS job.
  tokens:
    name: tokens
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Assert components consume tokens, never literals
        run: bun run check:tokens

  # `.bun-version` is the pin every `Set up Bun` step above reads, but Netlify's
  # build image takes its Bun from a `BUN_VERSION` variable and reads no version
  # file, and `engines.bun` and the `@types/bun` pin are npm metadata that cannot
  # reference one either. Those surfaces carry the number literally, so this job
  # is what stops them drifting away from it — including the case where somebody
  # answers a CI problem by typing a version back into `bun-version:` here, which
  # would make the file decorative with every other check still green.
  bun-version:
    name: bun-version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Assert every Bun version declaration matches .bun-version
        run: bun run check:bun-version

  # docs/COMPLIANCE.md §3: "Every binary asset committed under a public
  # directory needs a recorded origin. An asset with no provenance entry is
  # treated as non-compliant until it has one." §3 then lists the enforcement as
  # an OPEN ACTION — "Today: review, and nothing else" — and names the failure
  # it is most afraid of: set symbols as filter icons, "the single most likely
  # violation, because it is the obvious UI move and every card site does it".
  #
  # This job is that enforcement. It is offline and deterministic: it hashes
  # what is committed and compares against data/symbols/symbols.json. It does
  # NOT fetch anything, so it cannot fail because a third-party host is down.
  #
  # What it proves is that an asset's origin is RECORDED, not that the origin
  # was permitted — someone who ingests a set symbol and writes it an entry
  # passes this and fails the policy. The value is that doing so becomes a
  # visible diff naming a URL, rather than a PNG in a directory nobody reads.
  provenance:
    name: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Assert every committed binary asset has a verified origin
        run: bun run check:provenance

  disclaimer:
    name: disclaimer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: |
          set -euo pipefail
          # No fallback branch. bun.lock is committed, so the only thing an
          # `else` could ever do is let a pull request that DELETES the lockfile
          # silently downgrade every job to an unpinned install and still go
          # green — which is the one case where failing loudly is the point.
          bun install --frozen-lockfile

      # docs/COMPLIANCE.md §4 names this as an enforcement point, and it is the
      # only one that catches what review does not: a reflow, an editor
      # autocorrecting `®` or `™`, or a page rendered outside the shared layout.
      #
      # It builds the site itself rather than reusing the `build` job's output.
      # That costs a second build and buys independence — this job fails on its
      # own evidence, not on an artifact another job says is fine.
      #
      # The expected text is read from docs/PLAN.md, never from the site
      # source: comparing the build against a constant the build imports would
      # only prove the build is self-consistent. The matching source-side
      # assertion (constant == PLAN.md == README.md == COMPLIANCE.md) lives in
      # scripts/canonical-disclaimer.test.ts and runs in the `test` job.
      - name: Build the site
        run: bun run build

      - name: Assert the disclaimer appears verbatim on every built page
        run: bun run check:disclaimer

      # The token layer reaching the page is a separate fact from the tokens
      # being spelled correctly, and its failure mode is silent: a dropped
      # stylesheet renders browser defaults while every other check stays green.
      - name: Assert the token layer reaches every built page
        run: bun run check:built-tokens

      # docs/COMPLIANCE.md §5. The component test proves CardFace and
      # CardFaceGroup render the notice; it cannot see a page that renders a
      # face without going through them, which is the incident this project
      # actually had — 22 printing thumbnails as bare <img> on a page that
      # still carried one notice.
      #
      # So this COUNTS rather than testing presence: every image from the face
      # host must correspond to a face CardFace rendered. A presence test
      # passes that page, because one compliant face immunises every unmarked
      # one beside it.
      - name: Assert every card face on a built page came from CardFace
        run: bun run check:card-notice

  # THIS JOB ASSERTS SOMETHING WEAKER THAN IT USED TO, AND SAYS SO.
  #
  # It was written because `astro build` resolved SSR modules through Rollup
  # while `astro dev` handed the ones it externalised to Node's own ESM loader,
  # so a module only one of them could resolve made the two disagree completely.
  # That was not theoretical: the build emitted 7,237 correct pages while every
  # single dev route — pages, islands and /favicon.svg alike — answered 500, and
  # CI was green throughout, because nothing here had ever started the dev
  # server.
  #
  # Phase 6 removed the second resolver. `bun run dev` builds with the generator
  # and serves the files it wrote, so dev and production cannot disagree about a
  # module — there is only one of each. What is left to catch is a server that
  # does not start, a route-to-file mapping that does not match the generator's,
  # and the generated favicon going missing, which is a real failure this
  # project shipped: `document.tsx` linked /favicon.svg for four layers while
  # nothing emitted it.
  #
  # It is a smoke test by design. Six routes, one per kind of page plus the
  # generated favicon, asserting only that they are served at all.
  dev-server:
    name: dev-server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: |
          set -euo pipefail
          # No fallback branch. bun.lock is committed, so the only thing an
          # `else` could ever do is let a pull request that DELETES the lockfile
          # silently downgrade every job to an unpinned install and still go
          # green — which is the one case where failing loudly is the point.
          bun install --frozen-lockfile

      - name: Assert the dev server serves every kind of route
        run: bun run check:dev-server

  # NOTE: the repository-settings drift check deliberately does NOT live here.
  # It runs on a schedule, in .github/workflows/repo-settings-check.yml.
  #
  # It was a required job wired into `gate`, and that was wrong in a way worth
  # recording so nobody re-adds it. Reading the allow_*/delete_branch_on_merge
  # fields needs a token with administrative read, and `permissions:` has no
  # `administration` scope — so no workflow setting can raise GITHUB_TOKEN to
  # it, and only a hand-created personal access token works. Gating merges on
  # that means every pull request is red until a human adds a PAT, which is
  # exactly the auto-merge deadlock Phase 0 exists to avoid.
  #
  # It is also the wrong trigger. Repository settings drift when somebody
  # changes a setting, not when somebody changes code, so checking them per
  # pull request tests the wrong thing on the wrong event.

  # The single aggregate gate.
  #
  # This is the ONLY job that may be configured as a required status check on
  # the default branch (the ruleset in scripts/repo-settings.sh requires exactly
  # the name "CI Success"). Requiring the individual jobs above would strand
  # them in "pending" forever whenever a path filter skips one, which blocks
  # auto-merge permanently.
  #
  # THE JOB KEY AND THE DISPLAY NAME DIFFER, DELIBERATELY. Branch protection
  # matches on the DISPLAY name — the check-run name, which is `name:` when a
  # job sets one — so `CI Success` is the string the ruleset requires. The key
  # stays `gate` because it is what every `needs:` reference, the gate's own
  # completeness check below, and this repo's prose already call it; renaming
  # the key too would have been a second, unnecessary change with the same
  # blast radius. `CI Success` is the cross-repo standard name (issue #132),
  # shared with binfinite-app, SU-SRD and randsum so one ruleset checklist
  # applies to all four.
  #
  # It runs with `if: always()` so it reports a verdict even when a needed job
  # failed, was skipped, or the run was cancelled.
  gate:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - typecheck
      - lint
      - test
      - build
      - no-llm-dependencies
      - tokens
      - bun-version
      - provenance
      - disclaimer
      - dev-server
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # `.bun-version`, like the other ten steps in this file. This one
          # pinned `${{ env.BUN_VERSION }}` inline and reached main anyway,
          # because the PR that added the step and the PR that added the rule
          # were each green against a main that did not yet have the other, and
          # required checks were not `strict` — so the combination was never run
          # until a third PR inherited it.
          #
          # That is the incident that turned `strict` ON; see the ruleset note
          # in scripts/repo-settings.sh. It cannot recur the same way.
          bun-version-file: .bun-version

      # A gate can only aggregate what it was told to need, and `needs:` above
      # is maintained by hand. Adding a job to this workflow and forgetting to
      # list it there is a silent downgrade: the gate goes green without it and
      # nothing anywhere says so. docs/PLAN.md schedules exactly that change for
      # Phase 1 ("a11y and visual-regression checks wired into the aggregate
      # gate"), so the trigger is already on the roadmap.
      #
      # THIS WAS FORTY LINES OF INLINE awk AND jq, AND IT IS A SCRIPT NOW.
      # Inline, it could not be run before pushing, could not be tested, and
      # could not say anything about the two failure modes it did not model: a
      # `needs:` entry naming a job that no longer exists, and a required-check
      # context that names no job at all. `scripts/check-ci-aggregator.ts` is
      # the same rule with those cases covered and a test file behind it, and
      # `bun run check` runs it locally. It needs no `bun install` — it reads
      # two files with node builtins.
      #
      # It also stops hard-coding "gate": it reads the required status-check
      # context out of scripts/repo-settings.sh and finds the job that reports
      # it, so renaming the job and the ruleset together is a no-op here and
      # renaming one without the other is a failure.
      #
      # This is not the only place it runs. `scripts/check-ci-aggregator.test.ts`
      # asserts the same thing about the real workflow, so the `test` job above —
      # which is in the `needs:` list — goes red for an un-gated job minutes
      # before this step gets the chance. That is the fast signal; this is the
      # one that cannot be routed around, because a job can be dropped from
      # `needs:` and a step inside the gate cannot.
      - name: Assert every job in this workflow is wired into the gate
        run: bun run check:ci-aggregator

      - name: Aggregate job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          echo "$NEEDS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'

          count=$(echo "$NEEDS" | jq -r 'length')
          if [ "$count" -eq 0 ]; then
            echo "::error::gate has no needed jobs — the gate is not actually gating anything."
            exit 1
          fi

          # Allowlist, not denylist: only "success" and "skipped" pass.
          # "failure" and "cancelled" fail, and so does any result value this
          # script does not recognise.
          bad=$(echo "$NEEDS" | jq -r '
            [ to_entries[]
              | select((.value.result == "success" or .value.result == "skipped") | not)
              | "\(.key) (\(.value.result))"
            ] | join(", ")
          ')

          {
            echo "### gate"
            echo ""
            echo "| job | result |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$bad" ]; then
            echo "**Verdict: failed** — $bad" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::gate failed — these jobs did not succeed: ${bad}"
            exit 1
          fi

          echo "**Verdict: passed** — every job succeeded or was skipped." >> "$GITHUB_STEP_SUMMARY"
          echo "gate passed — all ${count} needed job(s) succeeded or were skipped."
