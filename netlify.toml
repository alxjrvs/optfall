# Netlify configuration for Optfall.
#
# The site is static output only — no functions, no edge handlers, no runtime.
# See docs/PLAN.md, "Stack": nothing here should stop working because its
# maintainer stopped paying attention.
#
# This file is public and contains no secrets, and must never contain one.
#
# It covers what the build needs, and nothing else. The site itself is created
# once by hand — `netlify sites:create`, or the UI — and linked to
# `alxjrvs/optfall` there, because that link is an OAuth grant between two
# accounts and is not expressible as configuration. There is deliberately no
# Terraform in this repository (docs/PLAN.md, "Stack"); the GitHub half is
# scripts/repo-settings.sh, and this is the Netlify half.
#
# Three site settings live only in the Netlify UI, so they are written down
# here rather than left as folklore. Confirm them once, when the site is
# created:
#
#   production branch      `main`
#   deploy previews        on — a legality bug is visible in a preview and
#                          invisible in a diff, which is why previews matter
#                          more on this project than on most
#   branch deploys         off — previews already cover pull requests, and every
#                          extra published surface is another place the required
#                          disclaimer has to be correct
#
# Also enable "prevent non-git production deploys" if the plan offers it: it
# closes the path where a stray `netlify deploy --prod` publishes a build that
# exists in no commit. For a project whose thesis is *being right*, serving
# legality data nobody can trace back to a source is the specific failure to
# design out.
#
# Anything below overrides the site's stored build settings at build time, so
# where the two disagree, this file is what ran.

[build]
  # Built from the repository root, not from apps/site, because the Bun
  # workspace only resolves from the root.
  #
  # The root `build` script fans out across the workspaces that DECLARE a build
  # script — today that is `apps/site` and nothing else, since `theme`,
  # `components` and `legality` are consumed from source. An earlier version of
  # this comment claimed it built "every workspace in dependency order", which
  # was not true then and would matter the day one of those packages needs a
  # compile step: the site would bundle a stale artefact and the deploy would
  # still be green.
  #
  # This is deliberately the same command CI runs. A deploy that succeeds where
  # the aggregate gate fails would be a lie about the state of `main`.
  #
  # Netlify detects Bun from the root lockfile and runs the install step itself.
  command = "bun run build"
  publish = "apps/site/dist"

[build.environment]
  # Pinned deliberately. This was here because Astro 7 required Node >= 22.12.0;
  # Phase 6 deleted Astro and the build is now Bun end to end, so nothing in it
  # reads NODE_VERSION. It stays pinned rather than removed because Netlify
  # picks its own default when the variable is absent, and an unpinned runtime
  # that changes under us is the thing this file exists to prevent.
  #
  # BUN_VERSION must equal env.BUN_VERSION in .github/workflows/ci.yml EXACTLY.
  # CI used to pin the floating line "1.3.x" against this exact pin, which meant
  # a green gate could attest to a build on a Bun that never produced the deploy
  # preview. Two exact pins that must match is a thing a human can check; an
  # exact pin against a floating line is not.
  NODE_VERSION = "22"
  BUN_VERSION = "1.3.14"

# `/cards` was the results page until it moved to `/search`, which is where
# every other card site puts it and therefore where people look. Permanent, so
# links already pasted survive — and a redirect rather than a deleted route,
# because query strings survive a 301 and `/cards?q=banned:cc` has to keep
# answering.
[[redirects]]
  from = "/cards"
  to = "/search"
  status = 301
  force = true

[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Deploy previews exist to catch legality bugs that are invisible in a diff.
# They are not the published site, so keep them out of search results.
[[context.deploy-preview.headers]]
  for = "/*"

  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex"

[[context.branch-deploy.headers]]
  for = "/*"

  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex"
